name: 开发事项
description: 登记一个可独立开发、验证和交付的功能、修复或内核变更
title: "[Dev] "
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issue 是可选线索入口，用于外部反馈或协作讨论；它不构成 Atom 的需求、状态或完成权威。需要实施时，以仓库内批准的 Superpowers 规格、当前计划、代码与新证据为准。
  - type: textarea
    id: goal
    attributes:
      label: 目标状态
      description: 用可验证的结果描述完成后必须达到什么状态，不写实施过程。
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前事实与证据
      description: 写明当前行为、错误码、相关提交或脱敏证据。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 边界与非目标
      description: 明确允许修改和禁止扩展的范围，避免把实例逻辑写入内核。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成与真实验收条件
      description: 同时列出自动测试、实际运行、正反例、回退、用户审核等必要条件。
      placeholder: |
        - [ ] 代码与聚焦测试完成
        - [ ] 完整回归通过
        - [ ] 真实运行环境通过
        - [ ] 正反例结果符合预期
        - [ ] 回退路径通过
        - [ ] 交付证据经总控审核
    validations:
      required: true
  - type: input
    id: superpowers_artifact
    attributes:
      label: Superpowers 规格或计划
      description: 已进入实施时填写仓库相对路径；仅提交线索时可以留空。
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与阻断关系
      description: 列出 blocked by / blocking 的 Issue；没有则写“无”。
    validations:
      required: true
  - type: checkboxes
    id: delivery
    attributes:
      label: 交付纪律
      options:
        - label: 我确认不会把开发提交、自动测试或局部门禁通过单独宣称为整体交付完成
          required: true
